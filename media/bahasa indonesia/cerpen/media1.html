<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ular Tangga Cerpen</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#2b5aa8,#0c1f45);color:#fff;min-height:100vh;padding:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:#ffb703;color:#10244d;transition:transform .15s}
button:hover:not(:disabled){transform:scale(1.05)}button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #fff}
#setup{max-width:560px;margin:20px auto;text-align:center;background:#ffffff1c;border-radius:20px;padding:24px}
#setup h1{font-size:1.9rem;margin-bottom:4px}
.tp{font-size:.82rem;text-align:left;margin:10px 0;padding-left:16px}
.badge{display:inline-block;background:#ffffff30;border-radius:20px;padding:2px 10px;font-size:.75rem;margin:2px}
#cnt button{margin:4px;width:46px;background:#fff}#cnt button.on{background:#ffb703}
#names{margin:10px 0}#names input{width:100%;margin:3px 0;padding:9px;border-radius:8px;border:0;font:inherit}
#game{display:none;flex-wrap:wrap;gap:14px;justify-content:center;max-width:1100px;margin:auto}
#bw{flex:1 1 560px;max-width:760px}
#board{position:relative;aspect-ratio:10/6;display:grid;grid-template:repeat(6,1fr)/repeat(10,1fr);border:4px solid #ffb703;border-radius:10px;background:#fff}
.c{font-size:clamp(8px,1.3vw,13px);padding:2px 3px;color:#10244d;font-weight:700}
.a{background:#ffe8a3}.b{background:#bfe3d0}.f{background:#ffb703}
#ov,#pw{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.p{position:absolute;width:4.2%;aspect-ratio:1;transform:translate(-50%,-50%);transition:left .25s,top .25s}
.p i{display:block;width:100%;height:100%;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 5px #0007}
.p.hop i{animation:hop .28s}@keyframes hop{50%{transform:translateY(-80%)}}
#side{flex:1 1 240px;max-width:300px;background:#ffffff1c;border-radius:16px;padding:14px;text-align:center}
#dice{width:76px;height:76px;margin:8px auto;background:#fff;color:#10244d;border-radius:16px;font-size:2.6rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #bbb}
#dice.shake{animation:sh .15s infinite}@keyframes sh{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#msg{min-height:44px;margin:8px 0;font-size:.9rem}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:4px 0;border-radius:10px;text-align:left}
.pl b{width:16px;height:16px;border-radius:50%;border:2px solid #fff}.pl span{margin-left:auto;font-weight:800}
.pl.cur{background:#ffb70055;outline:2px solid #ffb703}
#mute{position:fixed;top:8px;right:8px;z-index:9;padding:6px 10px}
#qm,#win{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:5;padding:10px}
#qm.on,#win.on{display:flex}
.card{background:#fff;color:#10244d;border-radius:18px;padding:20px;max-width:580px;width:100%;animation:pop .3s}@keyframes pop{from{transform:scale(.7);opacity:0}}
#qtag{font-weight:800;margin-bottom:6px}#qq{font-size:1.1rem;margin:8px 0}
#barw{height:10px;background:#dde;border-radius:6px;overflow:hidden}#bar{height:100%;width:100%;background:#2a9d8f;transition:width 1s linear}
#qo button{display:block;width:100%;text-align:left;margin:7px 0;background:#e8eefc}
#qo .good{background:#52b788;color:#fff}#qo .bad{background:#e63946;color:#fff}
.cf{position:fixed;top:-20px;width:10px;height:14px;animation:fall linear forwards;z-index:6}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<button id="mute" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">🔊</button>
<div id="setup">
 <h1>🐍 Ular Tangga Cerpen 🪜</h1>
 <div id="badges"></div>
 <ul class="tp" id="tpl"></ul>
 <p style="font-size:.85rem">Naik tangga: jawab benar. Kena kepala ular: jawab benar agar selamat. Waktu 1 menit per soal.</p>
 <h3 style="margin-top:14px">Jumlah pemain</h3>
 <div id="cnt"></div><div id="names"></div>
 <button onclick="start()" style="font-size:1.1rem;padding:12px 28px">Mulai Main</button>
</div>
<div id="game">
 <div id="bw"><div id="board"><svg id="ov" viewBox="0 0 100 60"></svg><div id="pw"></div></div></div>
 <div id="side"><div id="dice">🎲</div><button id="roll" onclick="roll()">Lempar Dadu</button><div id="msg"></div><div id="plist"></div></div>
</div>
<div id="qm"><div class="card"><div id="qtag"></div><div id="barw"><div id="bar"></div></div><div style="text-align:right;font-size:.8rem">⏱ <span id="tm">60</span> detik</div><div id="qq"></div><div id="qo"></div></div></div>
<div id="win"><div class="card" style="text-align:center"><h2 style="font-size:2rem">🏆 Selamat!</h2><p id="wn" style="margin:12px 0;font-size:1.2rem"></p><button onclick="location.reload()">Main Lagi</button></div></div>
<script>
const INFO={id:"ular-tangga-cerpen",title:"Ular Tangga Cerpen",subject:"Bahasa Indonesia",chapter:"Cerpen",
tp:["TP 1 — Menganalisis unsur intrinsik dan ekstrinsik cerpen","TP 2 — Menganalisis struktur dan kebahasaan cerpen"],
level:"SMA · Kelas XI",type:["Game","Kuis","Kompetisi"],
description:"Permainan ular tangga 60 kotak untuk 2–6 pemain dengan soal cerpen: unsur intrinsik, ekstrinsik, struktur, dan kebahasaan.",
path:"media/bahasa-indonesia/cerpen/media1.html",thumbnail:"images/ular-tangga-cerpen.jpg",color:"navy",icon:"book"};
const LAD={2:21,7:29,15:36,24:43,32:51,40:56,45:58},SNK={59:38,54:34,49:27,46:25,37:17,30:10,19:4};
const COL=['#e63946','#2a9d8f','#3a86ff','#8338ec','#fb5607','#06d6a0'],SC=['#d62828','#2a9d8f','#7b2cbf','#f77f00','#06a77d','#c9184a','#3a86ff'];
// [soal, jawaban benar, pengecoh1, pengecoh2, pengecoh3]
const BANK=[
["Unsur yang membangun cerpen dari dalam disebut…","Unsur intrinsik","Unsur ekstrinsik","Unsur kebahasaan","Unsur historis"],
["Unsur yang berada di luar karya tetapi memengaruhi cerpen disebut…","Unsur ekstrinsik","Unsur intrinsik","Unsur struktural","Unsur diksi"],
["Rangkaian peristiwa dalam cerpen disebut…","Alur","Tema","Latar","Amanat"],
["Alur yang menceritakan peristiwa secara berurutan dari awal sampai akhir adalah…","Alur maju","Alur mundur","Alur campuran","Alur statis"],
["Cerita yang dimulai dari akhir lalu kembali ke masa lalu memakai alur…","Alur mundur","Alur maju","Alur lurus","Alur datar"],
["Gabungan alur maju dan alur mundur disebut…","Alur campuran","Alur lurus","Alur linear","Alur tunggal"],
["Teknik sorot balik (kilas balik) disebut juga…","Flashback","Foreshadowing","Klimaks","Antiklimaks"],
["Penggunaan kata \"aku\" sebagai pelaku utama menunjukkan sudut pandang…","Orang pertama pelaku utama","Orang ketiga serba tahu","Orang ketiga terbatas","Orang kedua"],
["Narator memakai \"ia/dia\" dan mengetahui isi hati semua tokoh. Sudut pandangnya…","Orang ketiga serba tahu","Orang pertama pelaku utama","Orang pertama pelaku sampingan","Orang ketiga pengamat"],
["Tokoh yang wataknya tidak berubah dari awal hingga akhir disebut tokoh…","Statis","Dinamis","Antagonis","Tritagonis"],
["Tokoh yang wataknya berkembang selama cerita disebut tokoh…","Dinamis","Statis","Figuran","Datar"],
["Tokoh penentang tokoh utama disebut…","Antagonis","Protagonis","Tritagonis","Figuran"],
["Tokoh utama yang menjadi pusat cerita dan disimpati pembaca disebut…","Protagonis","Antagonis","Tritagonis","Figuran"],
["Tokoh penengah antara protagonis dan antagonis disebut…","Tritagonis","Protagonis","Antagonis","Figuran"],
["Pengarang menjelaskan watak tokoh secara langsung. Metode ini disebut…","Analitik","Dramatik","Kronologis","Retrospektif"],
["Watak tokoh digambarkan lewat dialog, tindakan, dan pikirannya. Metode ini disebut…","Dramatik","Analitik","Deskriptif","Naratif"],
["Latar dalam cerpen mencakup…","Tempat, waktu, dan suasana","Tokoh, alur, dan tema","Judul, tema, dan amanat","Pengarang, pembaca, penerbit"],
["Kata \"mencekam\" dan \"haru\" menggambarkan latar…","Suasana","Tempat","Waktu","Sosial"],
["Latar yang berkaitan dengan adat, kebiasaan, dan status sosial tokoh adalah latar…","Sosial","Tempat","Waktu","Fisik"],
["Gagasan pokok yang mendasari sebuah cerita disebut…","Tema","Amanat","Latar","Sinopsis"],
["Pesan moral yang ingin disampaikan pengarang disebut…","Amanat","Tema","Konflik","Alur"],
["Amanat tersirat berarti pesan itu…","Disimpulkan sendiri oleh pembaca","Ditulis langsung oleh pengarang","Selalu ada di judul","Tidak ada dalam cerita"],
["Pertentangan di dalam diri tokoh disebut konflik…","Batin","Sosial","Fisik","Alam"],
["Puncak ketegangan dalam sebuah cerita disebut…","Klimaks","Orientasi","Koda","Abstrak"],
["Bagian cerpen yang memperkenalkan tokoh, latar, dan awal cerita adalah…","Orientasi","Komplikasi","Resolusi","Koda"],
["Bagian cerpen tempat munculnya masalah atau konflik adalah…","Komplikasi","Orientasi","Koda","Abstrak"],
["Bagian cerpen yang berisi penyelesaian masalah adalah…","Resolusi","Evaluasi","Abstrak","Orientasi"],
["Bagian cerpen berupa ringkasan atau gambaran awal cerita (opsional) adalah…","Abstrak","Koda","Evaluasi","Resolusi"],
["Bagian akhir cerpen yang berisi komentar atau nilai dari cerita disebut…","Koda","Abstrak","Orientasi","Komplikasi"],
["Urutan struktur cerpen yang benar adalah…","Abstrak, orientasi, komplikasi, evaluasi, resolusi, koda","Orientasi, abstrak, resolusi, komplikasi, koda, evaluasi","Koda, orientasi, komplikasi, abstrak, resolusi, evaluasi","Abstrak, komplikasi, orientasi, koda, evaluasi, resolusi"],
["Latar belakang kehidupan pengarang termasuk unsur…","Ekstrinsik","Intrinsik","Kebahasaan","Struktural"],
["Nilai budaya, agama, politik, dan ekonomi masyarakat dalam cerpen termasuk unsur…","Ekstrinsik","Intrinsik","Alur","Latar"],
["Ciri khas cerpen adalah…","Singkat, dapat dibaca sekali duduk, dan fokus pada satu konflik","Panjang dengan banyak konflik berlapis","Tersusun dalam bait dan larik","Berisi fakta ilmiah"],
["\"Angin berbisik di telinga Sari.\" Kalimat tersebut memakai majas…","Personifikasi","Hiperbola","Simile","Ironi"],
["\"Tangisnya membanjiri seisi rumah.\" Majas yang digunakan adalah…","Hiperbola","Metafora","Simile","Litotes"],
["Majas yang membandingkan dua hal dengan kata \"seperti\" atau \"bagai\" adalah…","Simile","Metafora","Personifikasi","Sinekdoke"],
["Pilihan kata yang tepat oleh pengarang untuk membangun cerita disebut…","Diksi","Sinopsis","Orientasi","Parafrasa"],
["Kata \"kemudian\", \"setelah itu\", dan \"akhirnya\" termasuk konjungsi…","Temporal (waktu)","Kausalitas (sebab)","Konsesif","Pertentangan"],
["Kalimat langsung dalam dialog cerpen ditandai dengan…","Tanda petik","Tanda kurung","Garis miring","Tanda hubung"],
["Ungkapan \"keras kepala\" bermakna…","Tidak mau menurut nasihat","Kepalanya terbuat dari besi","Sangat pandai","Mudah marah"],
["Ringkasan singkat isi sebuah cerita disebut…","Sinopsis","Resolusi","Diksi","Orientasi"],
["Cerpen \"Robohnya Surau Kami\" adalah karya…","A.A. Navis","Chairil Anwar","Sapardi Djoko Damono","W.S. Rendra"],
["Cerpen \"Sepotong Senja untuk Pacarku\" adalah karya…","Seno Gumira Ajidarma","A.A. Navis","Ahmad Tohari","Hamka"],
["Kalimat yang banyak dipakai untuk menggambarkan tindakan tokoh dalam cerpen memakai kata kerja…","Material (tindakan)","Mental saja","Relasional saja","Pasif saja"]
];
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n);
let mute=false,ac,N=2,players=[],cur=0,busy=false,used=new Set();
function tone(f,d,ty='sine',at=0,v=.15,f2){if(mute)return;ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+at;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
const SFX={step:()=>tone(520+Math.random()*90,.08,'square',0,.05),dice:()=>tone(180+Math.random()*300,.05,'triangle',0,.1),
ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'sine',i*.1)),bad:()=>tone(240,.5,'sawtooth',0,.1,80),
up:()=>tone(300,1,'triangle',0,.15,1300),down:()=>tone(1000,1,'sawtooth',0,.09,110),tick:()=>tone(900,.06,'square',0,.05),
win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',i*.14))};
// setup
$('badges').innerHTML=[INFO.subject,INFO.level,INFO.chapter,...INFO.type].map(t=>`<span class="badge">${t}</span>`).join('');
$('tpl').innerHTML=INFO.tp.map(t=>`<li>${t}</li>`).join('');
function setN(n){N=n;[...$('cnt').children].forEach((b,i)=>b.classList.toggle('on',i+2==n));$('names').innerHTML=Array.from({length:n},(_,i)=>`<input maxlength="14" placeholder="Pemain ${i+1}" aria-label="Nama pemain ${i+1}" style="border-left:8px solid ${COL[i]}">`).join('')}
for(let i=2;i<=6;i++){const b=document.createElement('button');b.textContent=i;b.onclick=()=>setN(i);$('cnt').append(b)}setN(2);
function xy(n){n=Math.max(1,n);const r=Math.floor((n-1)/10);let c=(n-1)%10;if(r%2)c=9-c;return[c*10+5,(5-r)*10+5]}
function build(){let h='';for(let vr=0;vr<6;vr++){const br=5-vr;for(let c=0;c<10;c++){const n=br*10+(br%2?10-c:c+1);h+=`<div class="c ${n==60?'f':(vr+c)%2?'a':'b'}">${n==60?'🏁 60':n==1?'START 1':n}</div>`}}
$('board').insertAdjacentHTML('afterbegin',h);let s='';
for(const a in LAD){const[x1,y1]=xy(+a),[x2,y2]=xy(LAD[a]),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*1.3,ny=dx/L*1.3;
s+=`<g stroke="#8d5a2b" stroke-linecap="round"><line x1="${x1+nx}" y1="${y1+ny}" x2="${x2+nx}" y2="${y2+ny}" stroke-width="1"/><line x1="${x1-nx}" y1="${y1-ny}" x2="${x2-nx}" y2="${y2-ny}" stroke-width="1"/>`;
for(let t=1.5;t<L;t+=3.2){const px=x1+dx*t/L,py=y1+dy*t/L;s+=`<line x1="${px+nx}" y1="${py+ny}" x2="${px-nx}" y2="${py-ny}" stroke-width=".7"/>`}s+='</g>'}
let k=0;for(const h of Object.keys(SNK)){const[x1,y1]=xy(+h),[x2,y2]=xy(SNK[h]),dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),nx=-dy/L*6,ny=dx/L*6,c=SC[k++%7];
const d=`M${x1} ${y1}C${x1+dx/3+nx} ${y1+dy/3+ny},${x1+2*dx/3-nx} ${y1+2*dy/3-ny},${x2} ${y2}`;
s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" opacity=".9"/><path d="${d}" fill="none" stroke="#fff" stroke-width=".5" stroke-dasharray="1 2" opacity=".6"/><circle cx="${x1}" cy="${y1}" r="2.1" fill="${c}"/><circle cx="${x1-.8}" cy="${y1-.6}" r=".5" fill="#fff"/><circle cx="${x1+.8}" cy="${y1-.6}" r=".5" fill="#fff"/>`}
$('ov').innerHTML=s}
function place(){players.forEach(p=>{const same=players.filter(q=>Math.max(1,q.pos)==Math.max(1,p.pos)),i=same.indexOf(p),n=same.length,[x,y]=xy(p.pos),ox=n>1?(i%3-1)*2.4:0,oy=n>1?(Math.floor(i/3)-.5)*3.2:0;p.el.style.left=(x+ox)+'%';p.el.style.top=((y+oy)/60*100)+'%'});ui()}
function ui(){$('plist').innerHTML=players.map((p,i)=>`<div class="pl ${i==cur?'cur':''}"><b style="background:${p.col}"></b>${p.name}<span>${p.pos}</span></div>`).join('')}
function msg(t){$('msg').textContent=t}
function start(){ac=ac||new(window.AudioContext||webkitAudioContext)();const ins=[...$('names').children];
players=ins.map((e,i)=>({name:e.value.trim()||'Pemain '+(i+1),pos:0,col:COL[i]}));
$('setup').style.display='none';$('game').style.display='flex';build();
players.forEach(p=>{p.el=document.createElement('div');p.el.className='p';p.el.innerHTML=`<i style="background:${p.col}"></i>`;$('pw').append(p.el)});
place();msg('Giliran '+players[0].name+'. Lempar dadu!')}
async function roll(){if(busy)return;busy=true;$('roll').disabled=true;const p=players[cur];$('dice').classList.add('shake');
for(let i=0;i<10;i++){$('dice').textContent=1+rnd(6);SFX.dice();await sleep(70)}
$('dice').classList.remove('shake');const d=1+rnd(6);$('dice').textContent=d;msg(p.name+' mendapat angka '+d);await sleep(500);
const t=p.pos+d,path=[];for(let k=p.pos+1;k<=Math.min(t,60);k++)path.push(k);
if(t>60){for(let k=59;k>=120-t;k--)path.push(k);msg('Dadu berlebih! '+p.name+' mundur dari kotak 60.')}
for(const k of path){p.pos=k;p.el.classList.remove('hop');void p.el.offsetWidth;p.el.classList.add('hop');SFX.step();place();await sleep(290)}
if(p.pos==60){win(p);return}
const up=LAD[p.pos],dn=SNK[p.pos];
if(up||dn){const ok=await ask(p,!!up);
 if(up&&ok){msg('Benar! '+p.name+' naik tangga ke kotak '+up+' 🪜');await slide(p,up,'up')}
 else if(up){msg('Belum tepat. '+p.name+' tetap di kotak '+p.pos)}
 else if(!ok){msg('Salah! '+p.name+' digigit ular turun ke kotak '+dn+' 🐍');await slide(p,dn,'down')}
 else msg('Benar! '+p.name+' selamat dari ular 🎉')
 await sleep(900)}
cur=(cur+1)%N;ui();msg('Giliran '+players[cur].name+'. Lempar dadu!');busy=false;$('roll').disabled=false}
async function slide(p,to,ty){SFX[ty]();p.el.style.transitionDuration='1.2s';p.pos=to;place();await sleep(1300);p.el.style.transitionDuration=''}
function ask(p,isUp){return new Promise(res=>{let pool=BANK.map((_,i)=>i).filter(i=>!used.has(i));if(!pool.length){used.clear();pool=BANK.map((_,i)=>i)}
const qi=pool[rnd(pool.length)];used.add(qi);const b=BANK[qi],opts=b.slice(1).map((t,i)=>({t,ok:!i}));
for(let i=3;i>0;i--){const j=rnd(i+1);[opts[i],opts[j]]=[opts[j],opts[i]]}
$('qtag').innerHTML=`<span style="color:${p.col}">●</span> ${p.name}: ${isUp?'🪜 Jawab benar untuk naik tangga!':'🐍 Jawab benar agar lolos dari ular!'}`;
$('qq').textContent=b[0];$('qo').innerHTML='';let left=60,fin=false;$('tm').textContent=60;$('bar').style.transition='none';$('bar').style.width='100%';$('bar').style.background='#2a9d8f';
const bts=opts.map((o,i)=>{const bt=document.createElement('button');bt.textContent='ABCD'[i]+'. '+o.t;bt.onclick=()=>done(o.ok,bt);$('qo').append(bt);return bt});
$('qm').classList.add('on');setTimeout(()=>$('bar').style.transition='width 1s linear',50);
const iv=setInterval(()=>{left--;$('tm').textContent=left;$('bar').style.width=left/60*100+'%';if(left<=10){$('bar').style.background='#e63946';SFX.tick()}if(left<=0)done(false)},1000);
async function done(ok,bt){if(fin)return;fin=true;clearInterval(iv);bts.forEach((x,i)=>{x.disabled=true;if(opts[i].ok)x.classList.add('good')});if(bt&&!ok)bt.classList.add('bad');
if(bt===undefined)$('qq').textContent='⏰ Waktu habis! '+b[0];ok?SFX.ok():SFX.bad();await sleep(1700);$('qm').classList.remove('on');res(ok)}})}
function win(p){SFX.win();$('wn').textContent=p.name+' sampai di kotak finish!';$('win').classList.add('on');
for(let i=0;i<60;i++){const c=document.createElement('span');c.className='cf';c.style.cssText=`left:${rnd(100)}%;background:${COL[rnd(6)]};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*2}s`;document.body.append(c)}}
</script></body></html>
